# Neon PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://ep-nameless-field-bi5ct8ja-pooler.c-5.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${NEON_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


# Jackson deserialization: allow null for primitives without throwing HttpMessageNotReadableException
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Spring AI via OpenRouter.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1000






